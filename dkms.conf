# dkms-intree-kmod profile
#
# Change this one line after cloning the repository. The entrypoint resolves
# the source directory and the CONFIG_* symbol from the mounted kernel tree.
# For unusual layouts, KMOD_SOURCE_DIR and KMOD_CONFIG are optional overrides.

PACKAGE_VERSION="0.1.0"

# The only required per-module change.
BUILT_MODULE_NAME[0]="ptp_ocp"

# Standard DKMS metadata. The package name follows the module name so several
# modules can be registered independently.
PACKAGE_NAME="dkms-intree-kmod-${BUILT_MODULE_NAME[0]}"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
MAKE[0]="bash ./build.sh"

# Host-side wrapper settings. The image must already exist locally.
KMOD_IMAGE="dkms-intree-kmod:latest"
KMOD_CONTAINER_ENGINE=""

# Optional: override the host kernel-devel path used by the wrapper.
KMOD_KERNEL_DEVEL_DIR=""

# Shared host source RPM and prepared source tree cache.
KMOD_SOURCE_CACHE="/var/cache/dkms-intree-kmod"

# Optional: path relative to /kernel-source. Empty means auto-discover it.
KMOD_SOURCE_DIR=""

# Optional: space-separated Kbuild overrides, for example:
# KMOD_CONFIG="CONFIG_FOO=m CONFIG_BAR=m"
KMOD_CONFIG=""
